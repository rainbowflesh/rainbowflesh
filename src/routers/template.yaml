rules:
  # handle proxy
  - DOMAIN-KEYWORD,bing,Select
  - DOMAIN-KEYWORD,copymanga,Select
  - DOMAIN-KEYWORD,f95zone,Select
  - DOMAIN-KEYWORD,google,Download
  - DOMAIN-KEYWORD,mega,Download
  - DOMAIN-KEYWORD,productionresults,Download
  - DOMAIN-KEYWORD,terabox,Download
  - DOMAIN-SUFFIX,s3.amazonaws.com,Download
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,Select
  - PROCESS-NAME,WeMod.exe,Select
  # reject

  # no proxy
  - DOMAIN-KEYWORD,adobe,DIRECT
  - DOMAIN-KEYWORD,epic,DIRECT
  - DOMAIN-KEYWORD,jmcomic,DIRECT
  - DOMAIN-KEYWORD,lz-cdn,DIRECT
  - DOMAIN-KEYWORD,mixdrop,DIRECT
  - DOMAIN-KEYWORD,moyu,DIRECT
  - DOMAIN-KEYWORD,prod,DIRECT
  - DOMAIN-KEYWORD,zaimanhua,DIRECT
  - DOMAIN-KEYWORD,vikingf1le,DIRECT
  - DOMAIN-KEYWORD,vikingfile,DIRECT

  # based
  - RULE-SET,custom_reject,REJECT
  - RULE-SET,reject,REJECT
  - RULE-SET,gfw,Select
  - RULE-SET,custom_direct,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT
  - RULE-SET,cncidr,DIRECT
  - GEOIP,CN,DIRECT
  - GEOIP,LAN,DIRECT
  - MATCH,Select

# ------------ indicator ------------

proxy-groups:
  - name: Select
    type: select
    use:
      - ctc
      - sakuracat
    group:
      - Random
      - CTC
      - Sakuracat
  - name: Download
    type: select
    use:
      - ctc
      - sakuracat
  - name: Random
    use:
      - ctc
      - sakuracat
    type: load-balance
    strategy: round-robin
  - name: CTC
    use:
      - ctc
    type: load-balance
    strategy: round-robin
  - name: Sakuracat
    use:
      - sakuracat
    type: load-balance
    strategy: round-robin
    interval: 36000

# ------------ indicator ------------

proxy-providers:
  ctc:
    type: http
    url: https:///api/v1/client/subscribe?token=
    path: ./providers/ctc.yml
    interval: 604800
  sakuracat:
    type: http
    url: https://api.sublink.dev/sub?target=clash&url=http://.com/api/v1/client/subscribe?token=&emoji=false&list=true&tfo=false&fdn=true&sort=true&new_name=true&exclude=%E5%80%8D%7C%5B%E8%B7%9D%E5%A5%97%E6%B8%B8%E6%B5%81%E8%BD%AC%E5%80%8D%E5%9C%9F%5D%26include%3D%E8%BF%9B%E9%98%B6%7Ciepl%7CIEPL
    path: ./providers/sakuracat.yml
    interval: 604800

# ------------ indicator ------------

rule-providers:
  custom_reject:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/rainbowflesh/rainbowflesh@main/src/routers/custom_reject.yaml
    path: ./ruleset/custom_reject.yaml
    interval: 604800
  custom_direct:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/rainbowflesh/rainbowflesh@main/src/routers/custom_direct.yaml
    path: ./ruleset/custom_direct.yaml
    interval: 604800
  reject:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/reject.yaml
    interval: 604800
  private:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
    path: ./ruleset/private.yaml
    interval: 604800
  cncidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt
    path: ./ruleset/cncidr.yaml
    interval: 604800
  lancidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    path: ./ruleset/lancidr.yaml
    interval: 604800
  gfw:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt
    path: ./ruleset/gfw.yaml
    interval: 604800

# ------------ indicator ------------
experimental:
  sniff-tls-sni: true

# ------------ indicator ------------
find-process-mode: strict

# ------------ indicator ------------
# 启用 LightGBM 模型预测
uselightgbm: true
lgbm-auto-update: true
lgbm-update-interval: 72
lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin"

# ------------ indicator ------------
unified-delay: true

